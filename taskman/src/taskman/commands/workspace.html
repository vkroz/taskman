<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Taskman</title>
    <script>
      try {
        const theme = localStorage.getItem("taskman.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <style>
      /* ===== tokens ===== */
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --surface-2: #f3f4f6;
        --border: #e3e5ea;
        --border-input: #8c94a3;
        --text: #1b1f27;
        --text-2: #5b6474;
        --text-3: #8a93a3;
        --accent: #5145cd;
        --accent-soft: #ecebff;
        --on-accent: #ffffff;
        --state-active: #1d6fd8;
        --state-ready: #15803d;
        --state-done: var(--text-3);
        --blocked: #b45309;
        --warn: #b45309;
        --fail: #c62828;
        --danger: #c62828;
        --danger-soft: #fdecec;
        --pass: #15803d;
        --type-epic: #7c3aed;
        --type-feat: #0e7490;
        --shadow: rgba(16, 24, 40, 0.14);
        --backdrop: rgba(15, 17, 21, 0.4);
        --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s5: 24px;
        --s6: 32px;
        --r1: 4px;
        --r2: 6px;
        --r3: 8px;
        --head-h: 112px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0f1115;
          --surface: #16181d;
          --surface-2: #1c1f26;
          --border: #2a2e37;
          --border-input: #666d7c;
          --text: #e6e8ec;
          --text-2: #a1a8b5;
          --text-3: #6b7280;
          --accent: #8b83ff;
          --accent-soft: #262450;
          --on-accent: #0f1115;
          --state-active: #5ea0ff;
          --state-ready: #4ade80;
          --blocked: #fbbf24;
          --warn: #fbbf24;
          --fail: #f87171;
          --danger: #f87171;
          --danger-soft: #3a1d1f;
          --pass: #4ade80;
          --type-epic: #a78bfa;
          --type-feat: #22d3ee;
          --shadow: rgba(0, 0, 0, 0.5);
          --backdrop: rgba(0, 0, 0, 0.6);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1115;
        --surface: #16181d;
        --surface-2: #1c1f26;
        --border: #2a2e37;
        --border-input: #666d7c;
        --text: #e6e8ec;
        --text-2: #a1a8b5;
        --text-3: #6b7280;
        --accent: #8b83ff;
        --accent-soft: #262450;
        --on-accent: #0f1115;
        --state-active: #5ea0ff;
        --state-ready: #4ade80;
        --blocked: #fbbf24;
        --warn: #fbbf24;
        --fail: #f87171;
        --danger: #f87171;
        --danger-soft: #3a1d1f;
        --pass: #4ade80;
        --type-epic: #a78bfa;
        --type-feat: #22d3ee;
        --shadow: rgba(0, 0, 0, 0.5);
        --backdrop: rgba(0, 0, 0, 0.6);
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }

      /* ===== base ===== */
      [hidden] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        line-height: 20px;
        font-weight: 400;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 13px;
        line-height: 20px;
        color: inherit;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .icon {
        width: 16px;
        height: 16px;
        flex: none;
        display: block;
      }
      [data-icon] {
        display: inline-flex;
      }
      .icon .fill {
        fill: currentColor;
        stroke: none;
      }
      .icon .knock {
        stroke: var(--surface);
      }
      kbd {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 16px;
        padding: 0 var(--s1);
        border: 1px solid var(--border);
        border-radius: var(--r1);
        color: var(--text-2);
        background: var(--surface-2);
      }
      code {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--surface-2);
        border-radius: var(--r1);
        padding: 0 var(--s1);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .muted {
        color: var(--text-2);
      }

      /* ===== buttons and inputs ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        height: 32px;
        padding: 0 var(--s3);
        border: 1px solid var(--border);
        border-radius: var(--r2);
        background: var(--surface);
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--surface-2);
      }
      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .btn.sm {
        height: 28px;
        padding: 0 var(--s2);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .btn.primary kbd {
        background: transparent;
        color: var(--on-accent);
        border-color: var(--on-accent);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }
      .btn.ghost:hover {
        background: var(--surface-2);
      }
      .btn.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--on-accent);
      }
      .btn.icon-only {
        width: 32px;
        padding: 0;
        justify-content: center;
      }
      .btn.sm.icon-only {
        width: 28px;
      }
      .btn[aria-pressed="true"],
      .btn.on {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .linklike {
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent);
        cursor: pointer;
        font-weight: 500;
      }
      .linklike:hover {
        text-decoration: underline;
      }
      input,
      select,
      textarea {
        border: 1px solid var(--border-input);
        border-radius: var(--r2);
        background: var(--surface);
        padding: 5px var(--s2);
        min-width: 0;
      }
      select {
        height: 32px;
        padding: 0 var(--s2);
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--text-3);
      }
      textarea {
        resize: vertical;
        font-size: 14px;
        line-height: 22px;
      }
      .field {
        display: grid;
        gap: var(--s1);
      }
      .field > span:first-child,
      .field-label {
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: var(--text-2);
      }
      .hint {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
      }
      .field-error {
        font-size: 12px;
        line-height: 16px;
        color: var(--fail);
      }

      /* ===== app shell ===== */
      .app {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        min-height: 100vh;
      }
      .app.has-detail {
        grid-template-columns: 224px minmax(0, 1fr) 420px;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: var(--s4);
        padding: 0 var(--s2) var(--s3);
        border-right: 1px solid var(--border);
        background: var(--bg);
      }
      .brand {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--s2);
        align-content: center;
        min-height: 48px;
        padding: 0 var(--s2);
        font-weight: 600;
      }
      .brand-mark {
        color: var(--accent);
        display: inline-flex;
      }
      .brand .conn {
        margin-left: auto;
        flex-wrap: wrap;
        white-space: normal;
      }
      .brand .conn[data-status="retrying"],
      .brand .conn[data-status="offline"] {
        flex-basis: 100%;
        margin: 0;
      }
      .nav-title {
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: var(--text-2);
        padding: 0 var(--s2) var(--s1);
      }
      .nav {
        display: grid;
        gap: 1px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: var(--s2);
        height: 28px;
        padding: 0 var(--s2);
        border: 0;
        border-radius: var(--r2);
        background: transparent;
        cursor: pointer;
        text-align: left;
      }
      .nav button:hover {
        background: var(--surface-2);
      }
      .nav button[aria-current="true"] {
        background: var(--accent-soft);
        font-weight: 500;
      }
      .nav .n-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nav .n-count {
        font-size: 12px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .sidebar-foot {
        margin-top: auto;
      }
      .main {
        min-width: 0;
        background: var(--surface);
      }
      .head {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--surface);
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: var(--s3);
        height: 48px;
        padding: 0 var(--s4);
        border-bottom: 1px solid var(--border);
      }
      .topbar h1 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        white-space: nowrap;
      }
      .scope,
      .count {
        color: var(--text-2);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .search {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: var(--s2);
        width: min(320px, 40%);
        height: 32px;
        padding: 0 var(--s2);
        border: 1px solid var(--border-input);
        border-radius: var(--r2);
        background: var(--surface);
        color: var(--text-2);
      }
      .search:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .search input {
        flex: 1;
        border: 0;
        padding: 0;
        outline: none;
        background: transparent;
        color: var(--text);
      }
      .toolbar,
      .mbar {
        display: flex;
        align-items: center;
        gap: var(--s1);
        height: 36px;
        padding: 0 var(--s4);
        border-bottom: 1px solid var(--border);
      }
      .toolbar .spacer {
        flex: 1;
      }
      .toolbar select {
        height: 28px;
      }
      .facet .badge {
        font-size: 12px;
        line-height: 16px;
        padding: 0 var(--s1);
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-variant-numeric: tabular-nums;
      }
      .applied {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s1);
        padding: var(--s1) var(--s4);
        border-bottom: 1px solid var(--border);
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        height: 24px;
        padding: 0 var(--s1) 0 var(--s2);
        border: 1px solid var(--border);
        border-radius: var(--r1);
        background: var(--surface-2);
        font-size: 12px;
        line-height: 16px;
        cursor: pointer;
      }
      .fchip:hover {
        border-color: var(--border-input);
      }
      .applied .clear {
        margin-left: var(--s2);
        font-size: 12px;
      }
      .message {
        display: flex;
        align-items: center;
        gap: var(--s2);
        padding: var(--s2) var(--s4);
      }
      .message.error {
        background: var(--danger-soft);
        color: var(--fail);
      }

      /* ===== connection indicator ===== */
      .conn {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
        color: var(--text-2);
        white-space: nowrap;
      }
      .conn .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--pass);
        flex: none;
      }
      .conn[data-status="retrying"] .dot {
        background: var(--warn);
      }
      .conn[data-status="offline"] .dot {
        background: var(--fail);
      }
      .conn .linklike {
        font-size: 12px;
      }

      /* ===== list ===== */
      .list {
        container-type: inline-size;
        container-name: list;
      }
      .columns,
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 16px 56px 136px 120px 56px;
        column-gap: var(--s2);
        align-items: center;
        padding: 0 var(--s4) 0 var(--s1);
      }
      .columns {
        position: sticky;
        top: var(--head-h);
        z-index: 4;
        height: 28px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: var(--text-2);
      }
      .columns .h-main {
        padding-left: 52px;
      }
      .row {
        scroll-margin-top: calc(var(--head-h) + 28px);
        height: 36px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        background: var(--surface);
      }
      .row:hover {
        background: var(--surface-2);
      }
      .row:focus {
        outline: none;
      }
      .row:focus-visible {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .row.selected {
        background: var(--accent-soft);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .row.selected:focus-visible {
        box-shadow:
          inset 2px 0 0 var(--accent),
          inset 0 0 0 2px var(--accent);
      }
      .row.flash {
        animation: flash 2s ease-out;
      }
      @keyframes flash {
        from {
          background: var(--accent-soft);
        }
      }
      .row.drop-before {
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .row.drop-after {
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .row.dragging {
        opacity: 0.5;
      }
      .c-main {
        display: flex;
        align-items: center;
        gap: var(--s1);
        min-width: 0;
        height: 100%;
      }
      .handle {
        width: 16px;
        color: var(--text-3);
        cursor: grab;
        visibility: hidden;
        flex: none;
      }
      .row:hover .handle.on,
      .row:focus-within .handle.on {
        visibility: visible;
      }
      .indent {
        flex: none;
        width: calc(var(--depth, 0) * 16px);
      }
      .chev {
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: var(--r1);
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
        flex: none;
      }
      .chev:hover {
        background: var(--border);
      }
      .chev .icon {
        transition: transform 0.1s;
      }
      .chev.open .icon {
        transform: rotate(90deg);
      }
      .chev.none {
        visibility: hidden;
      }
      .type-slot {
        flex: none;
        display: inline-flex;
      }
      .type-icon {
        display: inline-flex;
      }
      .type-epic {
        color: var(--type-epic);
      }
      .type-feat {
        color: var(--type-feat);
      }
      .type-task {
        color: var(--text-2);
      }
      .key {
        flex: none;
        width: 64px;
        padding-left: var(--s1);
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .tw {
        display: flex;
        align-items: center;
        gap: var(--s2);
        min-width: 0;
        flex: 1;
      }
      .title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 0 1 auto;
      }
      .row.context .title {
        color: var(--text-2);
      }
      .crumb {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 0 2 auto;
        color: var(--text-2);
        font-size: 12px;
      }
      .crumb:empty {
        display: none;
      }
      .chips {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        flex: none;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        height: 20px;
        padding: 0 6px;
        border-radius: var(--r1);
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        background: var(--surface-2);
        color: var(--text-2);
      }
      .chip-draft {
        background: transparent;
        border: 1px dashed var(--border-input);
      }
      .chip-reason {
        background: transparent;
        border: 1px solid currentColor;
      }
      .chip-reason[data-reason="verification_failed"] {
        color: var(--fail);
      }
      .chip-reason[data-reason="ready_to_close"] {
        color: var(--pass);
      }
      .chip-reason[data-reason="verification_blocked"],
      .chip-reason[data-reason="handoff"] {
        color: var(--text-2);
      }
      .ctx {
        color: var(--text-3);
        display: inline-flex;
      }
      .c-ver,
      .c-prog,
      .c-state,
      .c-owner,
      .c-upd {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: var(--s1);
      }
      .c-prog,
      .c-upd {
        font-size: 12px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .verif[data-verification="pass"] {
        color: var(--pass);
      }
      .verif[data-verification="fail"] {
        color: var(--fail);
      }
      .verif[data-verification="blocked"] {
        color: var(--warn);
      }
      .verif[data-verification="stale"] {
        color: var(--text-3);
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .state .s-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .st-backlog .icon,
      .st-draft .icon {
        color: var(--text-3);
      }
      .st-ready .icon {
        color: var(--state-ready);
      }
      .st-blocked .icon {
        color: var(--blocked);
      }
      .st-active .icon {
        color: var(--state-active);
      }
      .st-done .icon {
        color: var(--state-done);
      }
      .ref {
        border: 0;
        background: none;
        padding: 0;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        cursor: pointer;
      }
      .ref:hover {
        text-decoration: underline;
      }
      .owner-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .avatar {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        background: var(--surface-2);
        color: var(--text-2);
        border: 1px solid var(--border);
      }
      .avatar[data-agent] {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .avatar .icon {
        width: 12px;
        height: 12px;
      }
      .group-header {
        display: flex;
        align-items: center;
        gap: var(--s2);
        height: 28px;
        padding: 0 var(--s4);
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
      }
      .group-header .g-name {
        font-weight: 600;
        color: var(--text);
      }
      .empty {
        display: grid;
        justify-items: center;
        gap: var(--s3);
        padding: var(--s6) var(--s4);
        text-align: center;
        color: var(--text-2);
      }
      .empty h2 {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        color: var(--text);
      }
      .empty .constraints {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--s1);
      }
      @container list (max-width: 1000px) {
        .columns,
        .row {
          grid-template-columns: minmax(0, 1fr) 16px 56px 136px 120px;
        }
        .c-upd {
          display: none;
        }
      }
      @container list (max-width: 860px) {
        .columns,
        .row {
          grid-template-columns: minmax(0, 1fr) 16px 56px 136px 24px;
        }
        .owner-name,
        .h-owner {
          display: none;
        }
      }
      @container list (max-width: 720px) {
        .row .chips .chip-label {
          display: none;
        }
      }
      @container list (max-width: 600px) {
        .columns,
        .row {
          grid-template-columns: minmax(0, 1fr) 16px 136px 24px;
        }
        .c-prog,
        .h-prog {
          display: none;
        }
      }

      /* ===== detail ===== */
      .detail {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        border-left: 1px solid var(--border);
        background: var(--surface);
        overscroll-behavior: contain;
      }
      .d-head {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: var(--s1);
        height: 48px;
        padding: 0 var(--s3) 0 var(--s4);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .d-head .spacer {
        flex: 1;
      }
      .d-key {
        border: 0;
        background: none;
        padding: 0 var(--s1);
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-2);
        cursor: copy;
        border-radius: var(--r1);
      }
      .d-key:hover {
        background: var(--surface-2);
      }
      .d-back {
        display: none;
      }
      .d-body {
        display: grid;
        gap: var(--s4);
        padding: var(--s4);
      }
      .d-body > section {
        display: grid;
        gap: var(--s2);
      }
      .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s1);
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
      }
      .crumbs a {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .d-title {
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .d-title:focus {
        outline: none;
      }
      .props {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s2) var(--s3);
      }
      .prop {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
      }
      .meta {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: var(--s1);
      }
      .locked {
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        color: var(--text-2);
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--r3);
        padding: var(--s3);
        display: grid;
        gap: var(--s2);
      }
      .section-title {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
        color: var(--text-2);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .section-title .right {
        margin-left: auto;
        text-transform: none;
        letter-spacing: 0;
      }
      .verdict {
        font-weight: 500;
        text-transform: none;
        letter-spacing: 0;
        color: var(--text);
      }
      .verdict[data-closable="true"] {
        color: var(--pass);
      }
      .gates {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--s1);
      }
      .gate {
        display: flex;
        align-items: flex-start;
        gap: var(--s2);
      }
      .gate a {
        white-space: nowrap;
      }
      .gate .icon {
        margin-top: 2px;
      }
      .gate[data-ok="true"] > .icon {
        color: var(--pass);
      }
      .gate[data-ok="false"] > .icon {
        color: var(--fail);
      }
      .gate-status[data-status="fail"],
      .gate-status[data-status="missing"] {
        color: var(--fail);
        font-weight: 500;
      }
      .gate-status[data-status="blocked"],
      .gate-status[data-status="stale"] {
        color: var(--text);
        font-weight: 500;
      }
      .gate-status[data-status="pass"],
      .gate-status[data-status="present"] {
        color: var(--pass);
        font-weight: 500;
      }
      .close-cmd {
        color: var(--text-2);
      }
      .desc {
        font-size: 14px;
        line-height: 22px;
        overflow-wrap: anywhere;
      }
      .desc > * + * {
        margin-top: var(--s2);
      }
      .desc h3,
      .desc h4 {
        font-size: 14px;
        line-height: 22px;
        font-weight: 600;
        margin-top: var(--s3);
      }
      .desc ul,
      .desc ol {
        margin-bottom: 0;
        padding-left: var(--s5);
      }
      .desc p,
      .desc ul,
      .desc ol,
      .desc pre,
      .desc blockquote {
        margin-left: 0;
        margin-right: 0;
        margin-bottom: 0;
      }
      .desc pre {
        background: var(--surface-2);
        border-radius: var(--r2);
        padding: var(--s2);
        overflow: auto;
      }
      .desc pre code {
        padding: 0;
      }
      .desc blockquote {
        border-left: 2px solid var(--border);
        padding-left: var(--s3);
        color: var(--text-2);
      }
      .segbar {
        display: flex;
        gap: 2px;
        height: 6px;
      }
      .segbar span {
        flex: 1;
        border-radius: var(--r1);
        background: var(--border);
      }
      .segbar [data-state="done"] {
        background: var(--pass);
      }
      .segbar [data-state="active"] {
        background: var(--state-active);
      }
      .segbar [data-state="blocked"] {
        background: var(--blocked);
      }
      .rel-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
      }
      .rel-item {
        display: grid;
        grid-template-columns: 16px 56px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: var(--s2);
        min-height: 32px;
        padding: 0 var(--s1);
        border-radius: var(--r2);
        cursor: pointer;
        border: 0;
        background: transparent;
        text-align: left;
        width: 100%;
      }
      .rel-item:hover {
        background: var(--surface-2);
      }
      .rel-item .key {
        width: auto;
        padding: 0;
      }
      .rel-item .title {
        flex: 1;
      }
      .tl-filters {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s1);
      }
      .tl-filters button {
        height: 24px;
        padding: 0 var(--s2);
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        font-size: 12px;
        line-height: 16px;
        cursor: pointer;
      }
      .tl-filters button[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .timeline {
        display: grid;
        gap: var(--s3);
      }
      .entry {
        display: grid;
        gap: var(--s1);
        padding-left: var(--s3);
        border-left: 2px solid var(--border);
      }
      .entry[data-result="fail"] {
        border-left-color: var(--fail);
      }
      .entry-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s1) var(--s2);
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
      }
      .entry-head .actor {
        color: var(--text);
        font-weight: 500;
      }
      .entry-text {
        font-size: 14px;
        line-height: 22px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .entry.change {
        border-left-color: transparent;
      }
      .entry.change .entry-head {
        color: var(--text-2);
      }
      .kind {
        font-weight: 500;
        color: var(--text);
      }
      .result {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        height: 20px;
        padding: 0 6px;
        border: 1px solid currentColor;
        border-radius: var(--r1);
        font-weight: 500;
      }
      .result[data-result="pass"] {
        color: var(--pass);
      }
      .result[data-result="fail"] {
        color: var(--fail);
      }
      .result[data-result="blocked"] {
        color: var(--text);
      }
      .rev-tag {
        font-family: var(--mono);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-top: 1px dashed var(--border);
      }
      .notice {
        margin: 0 var(--s4);
        border-radius: var(--r2);
      }
      #scrim {
        position: fixed;
        inset: 0;
        z-index: 19;
        background: var(--backdrop);
      }

      /* ===== popovers, menus, dialogs, toasts ===== */
      .popover {
        position: fixed;
        z-index: 30;
        min-width: 200px;
        max-width: min(320px, calc(100vw - 16px));
        max-height: 60vh;
        overflow: auto;
        padding: var(--s1);
        border: 1px solid var(--border);
        border-radius: var(--r3);
        background: var(--surface);
        box-shadow: 0 8px 24px var(--shadow);
      }
      .pop-search {
        width: 100%;
        margin-bottom: var(--s1);
      }
      .opt,
      .menu-item {
        display: flex;
        align-items: center;
        gap: var(--s2);
        width: 100%;
        min-height: 28px;
        padding: 0 var(--s2);
        border: 0;
        border-radius: var(--r2);
        background: transparent;
        cursor: pointer;
        text-align: left;
      }
      .opt:hover,
      .menu-item:hover,
      .menu-item:focus {
        background: var(--surface-2);
        outline: none;
      }
      .menu-item:focus-visible {
        outline: 2px solid var(--accent);
      }
      .menu-item[aria-disabled="true"] {
        cursor: default;
        color: var(--text-2);
      }
      .menu-item.danger {
        color: var(--danger);
      }
      .opt input {
        margin: 0;
      }
      .opt-label {
        flex: 1;
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        min-width: 0;
      }
      .opt-count {
        font-size: 12px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .sep {
        height: 1px;
        margin: var(--s1) 0;
        background: var(--border);
      }
      .pop-empty {
        padding: var(--s2);
        color: var(--text-2);
      }
      .adv-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s1);
        margin-bottom: var(--s1);
      }
      .adv-row select,
      .adv-row input {
        height: 28px;
      }
      .adv-row input {
        width: 120px;
      }
      dialog {
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        padding: 0;
        border: 1px solid var(--border);
        border-radius: var(--r3);
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 16px 48px var(--shadow);
      }
      dialog::backdrop {
        background: var(--backdrop);
      }
      .dlg-head {
        display: flex;
        align-items: center;
        gap: var(--s2);
        padding: var(--s3) var(--s3) 0 var(--s4);
      }
      .dlg-head h2 {
        flex: 1;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      .dlg-body {
        display: grid;
        gap: var(--s3);
        padding: var(--s3) var(--s4);
      }
      .dlg-foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--s2);
        padding: var(--s3) var(--s4);
        border-top: 1px solid var(--border);
      }
      .dlg-foot .confirm-text {
        margin-right: auto;
        font-weight: 500;
      }
      .dlg-error {
        border-radius: var(--r2);
      }
      .title-input {
        border: 0;
        padding: 0;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
        background: transparent;
      }
      .title-input:focus {
        outline: none;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s1);
        border: 0;
        margin: 0;
        padding: 0;
      }
      .pills legend {
        padding: 0;
        margin-bottom: var(--s1);
      }
      .pill {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: var(--s1);
        height: 28px;
        padding: 0 var(--s3);
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
      }
      .pill input {
        position: absolute;
        opacity: 0;
        inset: 0;
        margin: 0;
        cursor: pointer;
      }
      .pill:has(input:checked) {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .pill:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s3);
      }
      .tokens {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s1);
        min-height: 32px;
        padding: 3px var(--s1);
        border: 1px solid var(--border-input);
        border-radius: var(--r2);
      }
      .tokens:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .tokens input {
        flex: 1;
        min-width: 100px;
        border: 0;
        padding: 0 var(--s1);
        outline: none;
        background: transparent;
      }
      .tokens .chip button {
        border: 0;
        background: none;
        padding: 0;
        color: inherit;
        cursor: pointer;
        display: inline-flex;
      }
      .tokens .chip .icon {
        width: 12px;
        height: 12px;
      }
      .shortcuts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--s2) var(--s4);
        margin: 0;
      }
      .shortcuts dt {
        display: flex;
        gap: var(--s1);
      }
      .shortcuts dd {
        margin: 0;
      }
      #toasts {
        position: fixed;
        left: 50%;
        bottom: var(--s4);
        transform: translateX(-50%);
        z-index: 40;
        display: grid;
        gap: var(--s2);
        width: max-content;
        max-width: calc(100vw - 32px);
      }
      .toast {
        display: flex;
        align-items: center;
        gap: var(--s3);
        padding: var(--s2) var(--s3);
        border-radius: var(--r3);
        background: var(--text);
        color: var(--surface);
        box-shadow: 0 8px 24px var(--shadow);
      }
      .toast button {
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent-soft);
        font-weight: 600;
        cursor: pointer;
      }
      .toast code {
        background: transparent;
        color: inherit;
      }
      .m-only {
        display: none !important;
      }

      @media (min-width: 1600px) {
        .app.has-detail {
          grid-template-columns: 224px minmax(0, 1fr) 480px;
        }
      }
      /* Narrow screens: the detail is a full-height sheet over the list. */
      @media (max-width: 1149px) {
        .app.has-detail {
          grid-template-columns: 224px minmax(0, 1fr);
        }
        .detail {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          z-index: 20;
          width: min(560px, 100vw);
          height: auto;
          box-shadow: 0 0 32px var(--shadow);
        }
        .d-back {
          display: inline-flex;
        }
        .d-close {
          display: none;
        }
        html.sheet-open {
          overflow: hidden;
        }
      }
      /* Phones: app bar, 2-line rows, filters in one sheet. */
      @media (max-width: 719px) {
        .app,
        .app.has-detail {
          grid-template-columns: minmax(0, 1fr);
        }
        .sidebar,
        .toolbar,
        .columns,
        .d-only {
          display: none !important;
        }
        .m-only {
          display: inline-flex !important;
        }
        .mbar.m-only {
          display: flex !important;
        }
        .detail {
          inset: 0;
          width: 100vw;
        }
        .topbar {
          gap: var(--s2);
          padding: 0 var(--s3);
        }
        .topbar h1,
        .topbar .scope,
        .topbar .count {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
        }
        #view-select {
          flex: 1;
          min-width: 0;
          max-width: 200px;
          font-weight: 600;
        }
        .search {
          display: none;
        }
        .topbar.searching .search {
          display: flex;
          position: absolute;
          left: var(--s3);
          right: var(--s3);
          top: 8px;
          width: auto;
          z-index: 2;
        }
        .search kbd {
          display: none;
        }
        .conn .c-text {
          display: none;
        }
        .mbar {
          padding: 0 var(--s3);
          gap: var(--s2);
          height: 40px;
        }
        .mbar select {
          height: 28px;
        }
        .row {
          height: auto;
          min-height: 52px;
          padding: 6px var(--s3);
          grid-template-columns: auto 16px auto auto minmax(0, 1fr) auto auto;
          grid-template-areas:
            "ind chev type key state prog owner"
            "ind chev tw tw tw tw ver";
          row-gap: 0;
          column-gap: 6px;
        }
        .c-main {
          display: contents;
        }
        .handle,
        .c-upd {
          display: none;
        }
        .indent {
          grid-area: ind;
          width: calc(min(var(--depth, 0), 3) * 12px);
        }
        .chev {
          grid-area: chev;
          align-self: center;
        }
        .type-slot {
          grid-area: type;
        }
        .key {
          grid-area: key;
          width: auto;
          padding: 0;
        }
        .c-state {
          grid-area: state;
        }
        .c-prog {
          grid-area: prog;
          display: flex !important;
        }
        .c-owner {
          grid-area: owner;
        }
        .row .owner-name {
          display: none;
        }
        .tw {
          grid-area: tw;
        }
        .c-ver {
          grid-area: ver;
        }
        .row .chips .chip-label {
          display: inline-flex;
        }
        .row2 {
          grid-template-columns: 1fr;
        }
        #toasts {
          bottom: var(--s3);
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" aria-label="Navigation">
        <div class="brand">
          <span class="brand-mark" data-icon="logo"></span><span>Taskman</span
          ><span class="conn" data-conn></span>
        </div>
        <nav aria-label="Work views">
          <div class="nav-title">Views</div>
          <div class="nav" id="view-nav"></div>
        </nav>
        <nav aria-label="Projects">
          <div class="nav-title">Projects</div>
          <div class="nav" id="project-nav"></div>
        </nav>
        <div class="sidebar-foot">
          <button class="btn ghost sm" id="shortcuts-btn" type="button">
            <span data-icon="keyboard"></span>Shortcuts <kbd>?</kbd>
          </button>
        </div>
      </aside>
      <main class="main" id="main">
        <div class="head" id="head">
          <header class="topbar" id="topbar">
            <span class="brand-mark m-only" data-icon="logo"></span>
            <h1 id="view-title">Attention</h1>
            <span class="scope" id="scope"></span>
            <span class="count" id="count"></span>
            <select id="view-select" class="m-only" aria-label="View"></select>
            <div class="search" id="search-wrap">
              <span data-icon="search"></span>
              <input id="search" type="search" placeholder="Search…" aria-label="Search work items" autocomplete="off" />
              <kbd>/</kbd>
            </div>
            <button class="btn ghost icon-only m-only" id="search-toggle" type="button" aria-label="Search">
              <span data-icon="search"></span>
            </button>
            <span class="conn m-only" data-conn></span>
            <button class="btn primary d-only" id="new" type="button" aria-keyshortcuts="c">
              <span data-icon="plus"></span>New <kbd>C</kbd>
            </button>
            <button class="btn primary icon-only m-only" id="new-m" type="button" aria-label="New item">
              <span data-icon="plus"></span>
            </button>
          </header>
          <div class="toolbar" id="toolbar" role="toolbar" aria-label="Filters and sort"></div>
          <div class="mbar m-only">
            <button class="btn sm" id="filters-btn" type="button">
              <span data-icon="filter"></span><span id="filters-label">Filters</span>
            </button>
            <select id="project-select" aria-label="Project"></select>
          </div>
          <div class="applied" id="applied" hidden></div>
          <div class="message error" id="message" role="alert" hidden></div>
        </div>
        <div class="list" id="list">
          <div id="tree" role="treegrid" aria-labelledby="view-title">
            <div class="columns" role="row">
              <span class="h-main" role="columnheader">Work item</span>
              <span role="columnheader"><span class="sr-only">Verification</span></span>
              <span class="h-prog" role="columnheader">Progress</span>

      // ---- Markdown: a small sanitized subset, built with DOM nodes ----
      function inline(text) {

        let last = 0;

          if (match.index > last) nodes.push(text.slice(last, match.index));
          const token = match[0];
          if (match[1]) nodes.push(h("code", { text: token.slice(1, -1) }));
          else if (match[2]) nodes.push(h("strong", { text: token.slice(2, -2) }));
          else if (match[3]) nodes.push(h("em", { text: token.slice(1, -1) }));
          else {
            const [, label, href] = token.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/);
            const safe = /^(https?:|mailto:|\/|#)/i.test(href);

        const lead = lines[i] && lines[i].match(/^#\s+(.*)$/);
        if (lead && lead[1].trim() === String(title).trim()) i++;
        const out = [];
        let paragraph = [];
        let list = null;
        const flush = () => {
          if (paragraph.length) out.push(h("p", {}, inline(paragraph.join(" "))));
          paragraph = [];
          list = null;
        };
        for (; i < lines.length; i++) {
          const line = lines[i];
          if (/^```/.test(line)) {
            flush();
            const code = [];
            for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
            out.push(h("pre", {}, h("code", { text: code.join("\n") })));
            continue;

          const heading = line.match(/^(#{1,6})\s+(.*)$/);
          const item = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/);
          const quote = line.match(/^>\s?(.*)$/);
          if (!line.trim()) flush();
          else if (heading) {

            out.push(h(heading[1].length <= 2 ? "h3" : "h4", {}, inline(heading[2])));
          } else if (item) {
            const ordered = /\d/.test(item[1]);
            if (paragraph.length) flush();
            if (!list || list.ordered !== ordered) {

          } else {
            list = null;
            paragraph.push(line.trim());
          }
        }
        flush();
        return out;
      }

        const open = Object.fromEntries(S.data.projects.map((p) => [p.key, p]));

        const draw = () => {
          const q = input ? input.value.toLowerCase() : "";
          const shown = values.filter((v) => v.label.toLowerCase().includes(q));
          list.replaceChildren(...shown.map((v) => h("label", { class: "opt" },
            h("input", { type: "checkbox", value: v.value, checked: S.facets[facet.key].includes(v.value) }),
            h("span", { class: "opt-label" }, facet.key === "type" ? TypeIcon(v.value) : null, v.label),
            h("span", { class: "opt-count", text: v.count }))));
          if (!shown.length) list.append(h("p", { class: "pop-empty", text: "No values" }));
        };
        list.addEventListener("change", (event) => toggleFacet(facet.key, event.target.value, event.target.checked));
        if (input) {
          input.addEventListener("input", draw);
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              $("input[type=checkbox]", list)?.click();
            }
          });
        }
        draw();
        box.append(...[input, list].filter(Boolean));
        return box;
      }
      function advancedEditor() {
        const box = h("div", {});
        let timer = 0;
        const apply = () => {
          clearTimeout(timer);
          timer = setTimeout(() => filtersChanged(), 300);
        };
        const draw = () => {
          box.replaceChildren(...S.adv.map((rule, index) => {
            const field = h("select", { "aria-label": `Condition ${index + 1} field` },
              ADV_FIELDS.map(([key, label]) => h("option", { value: key, selected: key === rule.field }, label)));
            const op = h("select", { "aria-label": `Condition ${index + 1} operator` },
              OPS.map(([key, label]) => h("option", { value: key, selected: key === rule.op }, label)));
            const value = h("input", { "aria-label": `Condition ${index + 1} value`, value: rule.value, placeholder: "Value", hidden: rule.op === "exists" });
            field.onchange = () => { rule.field = field.value; apply(); };
            op.onchange = () => { rule.op = op.value; value.hidden = rule.op === "exists"; apply(); };
            value.oninput = () => { rule.value = value.value; apply(); };
            return h("div", { class: "adv-row" }, field, op, value,
              Button("", { kind: "ghost", size: "sm", icon: "close", title: `Remove condition ${index + 1}`, onclick: () => {
                S.adv.splice(index, 1);
                draw();
                filtersChanged();
              } }));
          }), Button("Add condition", { kind: "ghost", size: "sm", icon: "plus", onclick: () => {
            S.adv.push({ field: "title", op: "contains", value: "" });
            draw();
            $$(".adv-row input", box).pop()?.focus();
          } }));
        };
        draw();
        return box;
      }
      function buildToolbar() {
        const bar = $("#toolbar");
        const chip = (key, name, open) => {
          const label = h("span", { text: name });
          const badge = h("span", { class: "badge", hidden: true });
          const button = h("button", { class: "btn sm facet", type: "button", "data-facet": key, "aria-expanded": "false",
            "aria-haspopup": "dialog" }, label, badge);
          button._label = label;
          button._badge = badge;
          button.onclick = () => togglePopover(button, () => open(button));
          return button;
        };
        bar.append(chip("project", "Project", (button) => menu(button, [
          ...[{ key: "", name: "All projects" }, ...((S.data && S.data.projects) || [])].map((p) =>
            [projectLabel(p), () => setProject(p.key), { radio: true, checked: p.key === S.project }]),
        ], "Project")));
        for (const facet of FACETS) {
          bar.append(chip(facet.key, facet.name, (button) => {
            popover(button, (el) => el.append(facetChecklist(facet)), { label: `${facet.name} filter` });
            $(".pop-search", openPop.el)?.focus();
          }));
        }
        bar.append(chip("advanced", "Advanced filter", (button) => {
          popover(button, (el) => el.append(advancedEditor()), { label: "Advanced filter" });
          const first = $("select,input,button", openPop.el);
          if (first) first.focus();
        }));
        bar.append(h("span", { class: "spacer" }));
        const sort = h("select", { id: "sort", "aria-label": "Sort" }, SORTS.map(([key, label]) => h("option", { value: key }, label)));
        sort.onchange = () => {
          S.sort = sort.value;
          filtersChanged();
        };
        const direction = h("button", { class: "btn sm icon-only", type: "button", id: "direction", "aria-pressed": "false" });
        direction.onclick = () => {
          S.desc = !S.desc;
          filtersChanged();
        };
        const display = Button("Display", { size: "sm", icon: "display", attrs: { id: "display-btn", "aria-expanded": "false" } });
        display.onclick = () => togglePopover(display, () => {
          const theme = local.get("taskman.theme") || "system";
          menu(display, [
            ...[["system", "System theme"], ["light", "Light theme"], ["dark", "Dark theme"]].map(([key, label]) =>
              [label, () => setTheme(key), { radio: true, checked: theme === key }]),
            "-",
            ["Expand all", () => setAllCollapsed(false)],
            ["Collapse all", () => setAllCollapsed(true)],
          ], "Display");
        });
        bar.append(sort, direction, display);
      }
      function setTheme(theme) {
        local.set("taskman.theme", theme === "system" ? null : theme);
        if (theme === "system") delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = theme;
      }
      /** Phones: every filter in one sheet. */
      function openFilterSheet() {
        const sort = h("select", { "aria-label": "Sort" }, SORTS.map(([key, label]) => h("option", { value: key, selected: key === S.sort }, label)));
        sort.onchange = () => {
          S.sort = sort.value;
          filtersChanged();
        };
        Dialog({
          title: "Filters",
          submit: "Done",
          body: [
            ...FACETS.map((facet) => h("div", { class: "field" }, h("span", { class: "field-label", text: facet.name }), facetChecklist(facet, { search: false }))),
            h("label", { class: "field" }, h("span", { text: "Sort" }), sort),
            h("button", { class: "btn", type: "button", onclick: (event) => {
              clearFilters();
              event.target.closest("dialog").close();
            } }, "Clear filters"),
          ],
          onSubmit: async (dlg) => dlg.close(),
        });
      }

      // =====================================================================
      // Keyboard
      // =====================================================================
      function step(delta, open) {
        if (!S.visible.length) return;
        const index = S.visible.indexOf(S.focusId);
        const next = S.visible[Math.max(0, Math.min(S.visible.length - 1, index < 0 ? 0 : index + delta))];
        moveTo(next, open);
      }
      function moveTo(id, open) {
        const inPanel = preview.contains(document.activeElement);
        if (inPanel) {
          const before = rowNode(S.focusId);
          S.focusId = id;
          if (before) setAttr(before, "tabindex", "-1");
          const node = rowNode(id);
          if (node) {
            setAttr(node, "tabindex", "0");
            node.scrollIntoView({ block: "nearest" });
          }
        } else focusRow(id);
        if (open && S.item !== id) openItem(id, { focus: inPanel });
      }
      document.addEventListener("keydown", (event) => {
        if (event.defaultPrevented) return;
        if (document.querySelector("dialog[open]")) return; // dialogs handle their own keys
        const target = event.target;
        const typing = target.closest && target.closest("input,textarea,select,[contenteditable]");
        if (event.key === "Escape") {
          if (openPop) {
            closePopover(true);
            event.preventDefault();
          } else if (target.id === "search") {
            $("#topbar").classList.remove("searching");
            target.blur();
            focusRow(S.focusId);
          } else if (S.item && !typing) {
            event.preventDefault();
            closeItem();
          }
          return;
        }
        if (typing || event.ctrlKey || event.metaKey || event.altKey) return;
        const row = target.closest && target.closest("#rows .row");
        const panelOpen = !!S.item;
        switch (event.key) {
          case "/":
            event.preventDefault();
            openSearch();
            return;
          case "?":
            event.preventDefault();
            openShortcuts();
            return;
          case "c": {
            event.preventDefault();
            const focused = row ? S.byId.get(row.dataset.id) : null;
            const candidate = focused || (S.detail ? S.detail.row : null);
            openCreate({ parent: candidate && candidate.type !== "task" && candidate.status !== "done" ? candidate.id : null });
            return;
          }
          case "j":
          case "k":
            event.preventDefault();
            step(event.key === "j" ? 1 : -1, panelOpen);
            return;
        }
        if (!row) return;
        const id = row.dataset.id;
        const index = S.visible.indexOf(id);
        switch (event.key) {
          case "ArrowDown":
          case "ArrowUp":
            event.preventDefault();
            step(event.key === "ArrowDown" ? 1 : -1, panelOpen);
            break;
          case "Home":
          case "End":
            event.preventDefault();
            moveTo(event.key === "Home" ? S.visible[0] : S.visible[S.visible.length - 1], panelOpen);
            break;
          case "ArrowLeft": {
            event.preventDefault();
            if (S.kids.has(id) && !S.collapsed.has(id) && !isFlat()) toggleRow(id, false);
            else {
              const parent = (S.byId.get(id) || {}).parent_id;
              if (parent && S.visible.includes(parent)) moveTo(parent, panelOpen);
            }
            break;
          }
          case "ArrowRight":
            event.preventDefault();
            if (S.kids.has(id) && S.collapsed.has(id)) toggleRow(id, true);
            else if (S.kids.has(id) && !isFlat()) moveTo(S.visible[index + 1], panelOpen);
            break;
          case "Enter":
          case "o":
            event.preventDefault();
            openItem(id, { focus: true });
            break;
        }
      });
      function openSearch() {
        $("#topbar").classList.add("searching");
        $("#search").focus();
        $("#search").select();
      }

      // =====================================================================
      // Boot
      // =====================================================================
      function syncHeadHeight() {
        const height = $("#head").offsetHeight;
        $("#app").style.setProperty("--head-h", `${height}px`);
      }
      function boot() {
        for (const slot of $$("[data-icon]")) slot.append(icon(slot.dataset.icon));
        buildToolbar();
        loadCollapsed();
        readURL();
        if (location.pathname !== "/") history.replaceState({ panel: false }, "", buildURL());
        syncControls();
        renderTop();
        renderNav();
        renderApplied();
        renderConn();
        let searchTimer = 0;
        const search = $("#search");
        search.addEventListener("input", () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            S.q = search.value.trim();
            filtersChanged();
          }, 200);
        });
        search.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            const key = search.value.trim().toUpperCase();
            if (KEY_RE.test(key)) {
              event.preventDefault();
              openItem(key, { focus: true });
            }
          } else if ((event.key === "Tab" && !event.shiftKey) || event.key === "ArrowDown") {
            // One Tab from search lands on the list.
            if (S.focusId && rowNode(S.focusId)) {
              event.preventDefault();
              focusRow(S.focusId);
            }
          }
        });
        search.addEventListener("blur", () => {
          if (!search.value) $("#topbar").classList.remove("searching");
        });
        $("#search-toggle").onclick = openSearch;
        $("#new").onclick = () => openCreate({ parent: S.detail && S.detail.row.type !== "task" && S.detail.row.status !== "done" ? S.detail.row.id : null });
        $("#new-m").onclick = $("#new").onclick;
        $("#shortcuts-btn").onclick = openShortcuts;
        $("#filters-btn").onclick = openFilterSheet;
        $("#view-select").onchange = (event) => setView(event.target.value);
        $("#project-select").onchange = (event) => setProject(event.target.value);
        preview.addEventListener("click", (event) => {
          const ref = event.target.closest("a[data-ref]");
          if (ref && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
            event.preventDefault();
            openItem(ref.dataset.ref);
          }
        });
        new ResizeObserver(syncHeadHeight).observe($("#head"));
        if (S.item) showItem(S.item, { focus: isSheet() });
        refresh({ force: true });
      }
      boot();
    </script>
  </body>
</html>
