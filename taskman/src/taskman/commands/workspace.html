<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Taskman · Workspace</title>
    <style>
      [hidden] {
        display: none !important;
      }
      :root {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #202738;
        background: #f7f8fb;
        font-size: 14px;
        --line: #e4e7ef;
        --muted: #667085;
        --accent: #5145cd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: white;
        border-radius: 7px;
        padding: 8px 11px;
        color: inherit;
      }
      button:hover {
        background: #f0efff;
        border-color: #c7c1ef;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #aea6ff;
        outline-offset: 2px;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .primary:hover {
        background: #4035b0;
      }
      .danger {
        color: #b42318;
      }
      .app {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        min-width: 0;
        background: #f0f2f7;
        border-right: 1px solid var(--line);
        padding: 27px 16px;
        display: flex;
        flex-direction: column;
        gap: 25px;
      }
      .brand {
        font-weight: 750;
        font-size: 21px;
        letter-spacing: -0.8px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .mark {
        background: var(--accent);
        color: white;
        border-radius: 9px;
        padding: 4px 8px;
        font-size: 18px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 10px 10px;
      }
      .nav {
        display: grid;
        gap: 5px;
      }
      .nav button {
        text-align: left;
        border: 0;
        background: transparent;
        padding: 10px 12px;
      }
      .nav button[aria-current="true"] {
        background: #e3dff8;
        color: #4233ac;
        font-weight: 650;
      }
      .sidebar footer {
        margin-top: auto;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
        padding: 10px;
      }
      .content {
        min-width: 0;
        padding: 32px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin-bottom: 26px;
      }
      h1 {
        font-size: 27px;
        letter-spacing: -0.7px;
        margin: 0 0 5px;
      }
      p {
        line-height: 1.6;
      }
      .subtitle {
        color: var(--muted);
        margin: 0;
      }
      .toolbar {
        display: flex;
        align-items: end;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: #505a6f;
      }
      input,
      select,
      textarea {
        border: 1px solid #d4d9e3;
        border-radius: 7px;
        background: white;
        color: #202738;
        padding: 9px 10px;
        min-width: 0;
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      .search {
        flex: 1;
        min-width: 180px;
      }
      #filters {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .filter-row {
        display: flex;
        gap: 5px;
        padding: 7px;
        background: #eeeefa;
        border-radius: 8px;
        max-width: 100%;
        flex-wrap: wrap;
      }
      .filter-row select {
        max-width: 160px;
      }
      .filter-row input {
        width: 150px;
      }
      .surface {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 5px #15244304;
      }
      .collection-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .collection-head button {
        padding: 5px 8px;
        font-size: 12px;
      }
      .workspace {
        display: flex;
        gap: 20px;
        align-items: start;
      }
      .list-pane {
        flex: 1;
        min-width: 0;
      }
      .columns,
      .row {
        display: grid;
        grid-template-columns: minmax(150px, 1fr) 90px 70px 40px;
        gap: 10px;
        align-items: center;
        padding: 13px 16px;
      }
      .columns {
        font-size: 11px;
        font-weight: 650;
        color: var(--muted);
        background: #fafbfc;
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .row {
        border-top: 1px solid #f0f1f5;
        min-height: 57px;
      }
      .row:hover {
        background: #fafaff;
      }
      .row.selected {
        background: #f3f1ff;
      }
      .row.context {
        color: #7a8191;
        background: #fafbfc;
      }
      .row-title {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding-left: calc(var(--depth) * 16px);
      }
      .title-button {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
        font-weight: 550;
        overflow-wrap: anywhere;
        line-height: 1.45;
        min-width: 0;
      }
      .title-button:hover {
        background: transparent;
        color: var(--accent);
      }
      .toggle {
        border: 0;
        padding: 2px;
        background: none;
        flex: 0 0 20px;
        width: 20px;
      }
      .type {
        font-size: 11px;
        color: var(--muted);
      }
      .badge {
        font-size: 11px;
        border-radius: 20px;
        padding: 4px 8px;
        display: inline-block;
        width: fit-content;
        text-transform: capitalize;
        background: #f0f2f6;
      }
      .badge.active {
        color: #5841b0;
        background: #efebff;
      }
      .badge.done {
        color: #18724c;
        background: #e9f6ef;
      }
      .draft {
        font-size: 10px;
        color: #8a6420;
        margin-left: 4px;
      }
      .context-label {
        font-size: 10px;
        color: var(--muted);
      }
      .detail {
        width: 360px;
        flex: 0 0 360px;
        max-height: calc(100vh - 70px);
        overflow: auto;
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px;
        position: sticky;
        top: 25px;
      }
      .detail[hidden] {
        display: none;
      }
      .detail h2 {
        font-size: 20px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        margin: 14px 0;
      }
      .detail-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .detail h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--muted);
        margin: 25px 0 10px;
      }
      .body-text,
      .journal-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 13px;
        line-height: 1.65;
      }
      .metadata {
        display: grid;
        grid-template-columns: 85px minmax(0, 1fr);
        font-size: 12px;
        gap: 9px;
      }
      .metadata dt {
        color: var(--muted);
      }
      .metadata dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .entry {
        border-left: 2px solid #dcd6fb;
        padding: 0 0 0 12px;
        margin: 15px 0;
      }
      .entry-head {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .empty {
        text-align: center;
        padding: 55px 20px;
        color: var(--muted);
      }
      .empty strong {
        display: block;
        color: #344054;
        font-size: 16px;
        margin-bottom: 8px;
      }
      .message {
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        background: #edf7f0;
        color: #25613b;
      }
      .message.error {
        background: #fef0ef;
        color: #a42621;
      }
      .message:empty {
        display: none;
      }
      .bulk {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 16px;
        background: #f5f3ff;
        border-bottom: 1px solid var(--line);
      }
      .bulk[hidden] {
        display: none;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px;
        width: min(570px, calc(100vw - 30px));
        box-shadow: 0 20px 80px #17213a33;
      }
      dialog::backdrop {
        background: #1c254957;
      }
      dialog h2 {
        margin: 0 0 20px;
        font-size: 21px;
      }
      dialog form {
        display: grid;
        gap: 16px;
      }
      dialog textarea {
        min-height: 150px;
        resize: vertical;
      }
      dialog footer {
        display: flex;
        justify-content: end;
        gap: 9px;
      }
      dialog .hint {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
      .history-card {
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }
      .history-card h2 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      .history-card summary {
        cursor: pointer;
        color: var(--accent);
        margin: 12px 0;
      }
      .history-card pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 13px/1.6 inherit;
      }
      .history-link {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      @media (min-width: 1500px) {
        .detail {
          width: 430px;
          flex-basis: 430px;
        }
      }
      @media (max-width: 1150px) {
        .workspace {
          flex-direction: column;
        }
        .detail {
          width: 100%;
          flex-basis: auto;
          position: static;
          max-height: none;
        }
      }
      @media (max-width: 720px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          padding: 14px;
          gap: 12px;
          border-bottom: 1px solid var(--line);
          border-right: 0;
        }
        .sidebar footer,
        .eyebrow {
          display: none;
        }
        .nav {
          display: flex;
          overflow: auto;
          max-width: 100%;
        }
        .nav button {
          white-space: nowrap;
          font-size: 12px;
        }
        .content {
          padding: 20px 12px;
        }
        .heading {
          align-items: start;
        }
        h1 {
          font-size: 23px;
        }
        .columns,
        .row {
          grid-template-columns: minmax(110px, 1fr) 70px;
          gap: 6px;
          padding: 12px;
        }
        .type-col,
        .priority-col {
          display: none;
        }
        .row-title {
          padding-left: calc(var(--depth) * 10px);
          gap: 3px;
        }
        .toolbar label {
          max-width: 100%;
        }
        .toolbar select {
          max-width: 170px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="mark">t</span> Taskman</div>
        <div>
          <p class="eyebrow">Workspace</p>
          <nav class="nav" aria-label="Work views">
            <button data-view="all" aria-current="true">All work</button
            ><button data-view="current">Current</button
            ><button data-view="backlog">Backlog</button
            ><button data-view="done">Done</button
            ><button data-view="history">Consolidated history</button>
          </nav>
        </div>
        <footer>
          Shared context.<br />Work that moves forward.<br /><span
            id="connection"
            role="status"
            >Connecting…</span
          >
        </footer>
      </aside>
      <main class="content">
        <header class="heading">
          <div>
            <h1 id="view-title">All work</h1>
            <p class="subtitle">Plan, follow through, keep the context.</p>
          </div>
          <button class="primary" id="new">＋ New task</button>
        </header>
        <div id="message" role="status"></div>
        <section id="controls">
          <div class="toolbar">
            <label class="search"
              >Search work<input
                id="search"
                type="search"
                placeholder="Search titles, descriptions, metadata…" /></label
            ><label
              >Epic scope<select id="epic" aria-label="Epic scope">
                <option value="">All epics</option>
              </select></label
            ><label
              >Sort by<select id="sort" aria-label="Sort by">
                <option value="priority">Priority</option>
                <option value="title">Title</option>
                <option value="status">Status</option>
                <option value="id">ID</option>
                <option value="type">Type</option>
              </select></label
            ><button id="direction" aria-label="Reverse sort order">
              ↑ Asc</button
            ><button id="add-filter">＋ Filter</button>
          </div>
          <div id="filters"></div>
        </section>
        <div class="workspace">
          <section class="list-pane surface" aria-label="Work items">
            <div class="collection-head">
              <span id="count">Loading work…</span>
              <div>
                <button id="expand">Expand all</button>
                <button id="collapse">Collapse all</button>
                <button id="clear">Clear filters</button>
              </div>
            </div>
            <div class="bulk" id="bulk" hidden>
              <span id="selection-count"></span
              ><button id="consolidate">Consolidate completed work</button
              ><button id="clear-selection">Clear selection</button>
            </div>
            <div id="tree"></div>
          </section>
          <aside
            class="detail"
            id="preview"
            aria-label="Task details"
            hidden
          ></aside>
        </div>
      </main>
    </div>
    <dialog id="editor">
      <form id="edit-form">
        <h2 id="editor-title">Create task</h2>
        <label>Title<input name="title" required maxlength="200" /></label>
        <div class="toolbar" id="create-fields">
          <label
            >Type<select name="type">
              <option value="task">Task</option>
              <option value="feat">Story / feature</option>
              <option value="epic">Epic</option>
            </select></label
          ><label
            >Parent<select name="parent">
              <option value="">No parent</option>
            </select></label
          >
        </div>
        <label
          >Description and acceptance criteria<textarea
            name="body"
            required
          ></textarea></label
        ><label id="reason-label" hidden
          >Reason for change<input name="reason"
        /></label>
        <p class="hint">Changes stay in your local Taskman project.</p>
        <div id="form-error" class="message error" role="alert"></div>
        <footer>
          <button type="button" data-close="editor">Cancel</button
          ><button type="submit" class="primary">Save task</button>
        </footer>
      </form>
    </dialog>
    <dialog id="confirm">
      <form id="confirm-form">
        <h2 id="confirm-title"></h2>
        <p id="confirm-description"></p>
        <label id="summary-label"
          >Summary title<input id="summary-title" maxlength="200"
        /></label>
        <div id="confirm-error" class="message error" role="alert"></div>
        <footer>
          <button type="button" data-close="confirm">Cancel</button
          ><button type="submit" class="primary" id="confirm-submit">
            Confirm
          </button>
        </footer>
      </form>
    </dialog>
    <script>
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      let openSummaries = new Set();
      let view = "all",
        rows = [],
        all = [],
        fields = [],
        histories = [],
        collapsed = new Set(),
        selected = new Set(),
        selectedId = null,
        filters = [],
        descending = false,
        editing = null,
        operation = null,
        serial = 0;
      async function api(path, data) {
        const r = await fetch(
          path,
          data === undefined
            ? {}
            : {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-Taskman": "1",
                },
                body: JSON.stringify(data),
              },
        );
        let value;
        try {
          value = await r.json();
        } catch {
          throw Error(
            "The server could not complete the request. Retry after refreshing.",
          );
        }
        if (!r.ok) throw Error(value.error || "Request failed");
        return value;
      }
      function message(text, error = false) {
        $("#message").className = "message" + (error ? " error" : "");
        $("#message").textContent = text;
      }
      function activeFilters() {
        let f = filters.map((x) => ({ ...x }));
        if (view === "current")
          f.push({ field: "status", op: "eq", value: "active,backlog" });
        if (view === "backlog" || view === "done")
          f.push({ field: "status", op: "eq", value: view });
        return f;
      }
      async function refresh() {
        let n = ++serial;
        $("#connection").textContent = "Updating…";
        $("#tree").setAttribute("aria-busy", "true");
        try {
          let result = await api("/api/query", {
            filters: activeFilters(),
            keyword: $("#search").value,
            epic: $("#epic").value,
            sort: $("#sort").value,
            descending,
          });
          if (n !== serial) return;
          rows = result.rows;
          all = result.all;
          fields = result.fields;
          histories = result.history;
          let epic = $("#epic").value;
          $("#epic").innerHTML =
            '<option value="">All epics</option>' +
            all
              .filter((r) => r.metadata.type === "epic" && !r.archived)
              .map(
                (r) =>
                  `<option value="${esc(r.id)}">${esc(r.metadata.title)}</option>`,
              )
              .join("");
          $("#epic").value = epic;
          let sort = $("#sort").value;
          $("#sort").innerHTML = [
            ...new Set([
              "priority",
              "title",
              "status",
              "id",
              "type",
              ...fields,
            ]),
          ]
            .map((f) => `<option value="${esc(f)}">${esc(f)}</option>`)
            .join("");
          $("#sort").value = sort;
          selected = new Set(
            [...selected].filter((id) =>
              all.some((r) => r.id === id && !r.archived),
            ),
          );
          render();
          $("#connection").textContent = "Up to date";
          $("#tree").setAttribute("aria-busy", "false");
          if (selectedId && !$("#editor").open) await detail(selectedId, false);
        } catch (e) {
          $("#connection").textContent = "Connection interrupted";
          $("#tree").setAttribute("aria-busy", "false");
          message(e.message, true);
        }
      }
      function render() {
        if (view === "history") {
          renderHistory();
          return;
        }
        $("#controls").hidden = false;
        $("#expand").hidden = $("#collapse").hidden = false;
        $("#count").textContent =
          `${rows.filter((r) => !r.context).length} work items`;
        let byId = Object.fromEntries(rows.map((r) => [r.id, r]));
        function hidden(r) {
          let p = r.parent_id;
          while (p && byId[p]) {
            if (collapsed.has(p)) return true;
            p = byId[p].parent_id;
          }
          return false;
        }
        let html =
          '<div class="columns"><span>Work item</span><span>Status</span><span class="type-col">Type</span><span class="priority-col">Pri.</span></div>';
        for (const r of rows) {
          if (hidden(r)) continue;
          let m = r.metadata,
            hasChildren = rows.some((x) => x.parent_id === r.id);
          html += `<div class="row ${r.context ? "context" : ""} ${r.id === selectedId ? "selected" : ""}" data-id="${r.id}"><div class="row-title" style="--depth:${r.depth}"><button class="toggle" data-toggle="${r.id}" aria-label="${collapsed.has(r.id) ? "Expand" : "Collapse"} ${esc(m.title)}" ${hasChildren ? 'aria-expanded="' + !collapsed.has(r.id) + '"' : "disabled"}>${hasChildren ? (collapsed.has(r.id) ? "▸" : "▾") : "·"}</button><input type="checkbox" aria-label="Select ${esc(m.title)}" data-select="${r.id}" ${selected.has(r.id) ? "checked" : ""}><div><button class="title-button" data-open="${r.id}">${esc(m.title || r.id)}</button>${m.draft ? '<span class="draft">Draft</span>' : ""}${r.context ? '<div class="context-label">Parent context</div>' : ""}</div></div><span class="badge ${esc(m.status)}">${esc(m.status)}</span><span class="type type-col">${esc(m.type)}</span><span class="muted priority-col">${esc(m.priority)}</span></div>`;
        }
        if (!rows.length)
          html =
            '<div class="empty"><strong>No matching work</strong><p>Try another search or clear your filters.</p><button data-clear>Clear filters</button></div>';
        $("#tree").innerHTML = html;
        $("#bulk").hidden = !selected.size;
        $("#selection-count").textContent = `${selected.size} selected`;
      }
      function renderHistory() {
        $("#controls").hidden = true;
        $("#bulk").hidden = true;
        $("#expand").hidden = $("#collapse").hidden = true;
        $("#count").textContent = `${histories.length} summaries`;
        $("#tree").innerHTML = histories.length
          ? histories
              .map(
                (h) =>
                  `<article class="history-card"><h2>${esc(h.title)}</h2><span class="muted">${h.ids.length} retained records</span><details data-history="${esc(h.key)}" ${openSummaries.has(h.key) ? "open" : ""}><summary>Read documentation summary</summary><pre>${esc(h.summary)}</pre></details><a class="history-link" href="/api/history/${esc(h.key)}" download>Download Markdown</a><p>${h.ids.map((id) => `<button data-open="${id}">${esc(all.find((r) => r.id === id)?.metadata.title || id)}</button>`).join(" ")}</p></article>`,
              )
              .join("")
          : '<div class="empty"><strong>No consolidated work yet</strong><p>Select completed work to create a documentation summary.</p></div>';
      }
      async function detail(id, open = true) {
        try {
          const r = await api("/api/show/" + id);
          if (open) {
            selectedId = id;
            $("#preview").hidden = false;
            render();
          }
          if (selectedId !== id) return;
          let m = r.frontmatter;
          $("#preview").innerHTML =
            `<div class="detail-top"><span>${esc(m.type)} · ${esc(id)}</span><button aria-label="Close task details" id="close-details">✕</button></div><h2>${esc(m.title)}</h2><span class="badge ${esc(m.status)}">${esc(m.status)}</span><div class="actions"><button id="edit-task" ${m.status === "done" ? 'disabled title="Completed work is immutable"' : ""}>Edit task</button><button id="delete-task" class="danger" ${!m.draft || m.status === "done" ? 'disabled title="Only unreferenced draft leaves can be deleted"' : ""}>Delete draft</button></div><h3>Description</h3><div class="body-text">${esc(r.body)}</div><h3>Metadata</h3><dl class="metadata">${Object.entries(
              m,
            )
              .filter(([k]) => k !== "journal")
              .map(
                ([k, v]) =>
                  `<dt>${esc(k)}</dt><dd>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</dd>`,
              )
              .join(
                "",
              )}</dl><h3>Activity & evidence</h3>${(m.journal || []).map((e) => `<div class="entry"><div class="entry-head">${esc(e.kind)} · ${esc(e.actor)} ${esc(e.result || "")}</div><div class="journal-text">${esc(e.text)}</div></div>`).join("") || '<p class="muted">No journal entries yet.</p>'}`;
          $("#close-details").onclick = closeDetails;
          $("#edit-task").onclick = () => openEditor({ id, ...r });
          $("#delete-task").onclick = () => confirmDelete(id);
        } catch (e) {
          message(e.message, true);
        }
      }
      function closeDetails() {
        $("#preview").hidden = true;
        selectedId = null;
        render();
      }
      function openEditor(item = null) {
        editing = item;
        const form = $("#edit-form");
        form.reset();
        $("#editor-title").textContent = item ? "Edit task" : "Create task";
        $("#create-fields").hidden = !!item;
        $("#reason-label").hidden = !item;
        form.elements.reason.required = !!item;
        form.elements.parent.innerHTML =
          '<option value="">No parent</option>' +
          all
            .filter(
              (r) => r.metadata.type !== "task" && r.metadata.status !== "done",
            )
            .map(
              (r) =>
                `<option value="${r.id}">${esc(r.metadata.title)}</option>`,
            )
            .join("");
        if (item) {
          form.elements.title.value = item.frontmatter.title;
          form.elements.body.value = item.body;
        }
        $("#form-error").textContent = "";
        $("#editor").showModal();
      }
      $("#edit-form").onsubmit = async (e) => {
        e.preventDefault();
        let data = Object.fromEntries(new FormData(e.target));
        try {
          let result = await api(
            editing ? "/api/edit" : "/api/items",
            editing ? { ...data, id: editing.id } : data,
          );
          $("#editor").close();
          message(editing ? "Task updated." : "Task created.");
          await refresh();
          await detail(editing ? editing.id : result.id);
        } catch (err) {
          $("#form-error").textContent = err.message;
        }
      };
      function confirmDelete(id) {
        operation = { kind: "delete", id };
        $("#confirm-title").textContent = "Delete this draft?";
        $("#confirm-description").textContent =
          "Only an unreferenced draft without children can be deleted. Finalized and completed records are retained.";
        $("#summary-label").hidden = true;
        $("#summary-title").required = false;
        $("#confirm-error").textContent = "";
        $("#confirm-submit").textContent = "Delete draft";
        $("#confirm").showModal();
      }
      $("#consolidate").onclick = () => {
        operation = { kind: "consolidate", ids: [...selected] };
        $("#confirm-title").textContent = "Consolidate completed work";
        $("#confirm-description").textContent =
          "Create a documentation summary for the selection and its descendants. All must be done. Original records remain available in Consolidated history; individual items leave the ordinary list.";
        $("#summary-label").hidden = false;
        $("#summary-title").required = true;
        $("#summary-title").value = "Completed work summary";
        $("#confirm-error").textContent = "";
        $("#confirm-submit").textContent = "Create summary";
        $("#confirm").showModal();
      };
      $("#confirm-form").onsubmit = async (e) => {
        e.preventDefault();
        try {
          await api(
            operation.kind === "delete" ? "/api/discard" : "/api/consolidate",
            operation.kind === "delete"
              ? { id: operation.id }
              : { ids: operation.ids, title: $("#summary-title").value },
          );
          $("#confirm").close();
          closeDetails();
          selected.clear();
          message(
            operation.kind === "delete"
              ? "Draft deleted."
              : "Summary saved in project documentation. Originals are available in Consolidated history.",
          );
          await refresh();
        } catch (err) {
          $("#confirm-error").textContent = err.message;
        }
      };
      function renderFilters() {
        $("#filters").innerHTML = filters
          .map(
            (f, i) =>
              `<div class="filter-row"><select aria-label="Filter attribute ${i + 1}" data-filter="${i}" data-key="field">${fields.map((k) => `<option ${k === f.field ? "selected" : ""}>${esc(k)}</option>`).join("")}</select><select aria-label="Filter operator ${i + 1}" data-filter="${i}" data-key="op">${[
                ["eq", "is (comma = OR)"],
                ["contains", "contains"],
                ["exists", "exists"],
              ]
                .map(
                  ([v, t]) =>
                    `<option value="${v}" ${f.op === v ? "selected" : ""}>${t}</option>`,
                )
                .join(
                  "",
                )}</select><input aria-label="Filter value ${i + 1}" data-filter="${i}" data-key="value" value="${esc(f.value)}" placeholder="Value"><button aria-label="Remove filter ${i + 1}" data-remove="${i}">✕</button></div>`,
          )
          .join("");
      }
      $("#filters").oninput = (e) => {
        if (e.target.dataset.filter !== undefined) {
          filters[+e.target.dataset.filter][e.target.dataset.key] =
            e.target.value;
          refresh();
        }
      };
      $("#filters").onclick = (e) => {
        if (e.target.dataset.remove !== undefined) {
          filters.splice(+e.target.dataset.remove, 1);
          renderFilters();
          refresh();
        }
      };
      $("#add-filter").onclick = () => {
        filters.push({ field: "status", op: "eq", value: "" });
        renderFilters();
      };
      function clear() {
        filters = [];
        $("#search").value = "";
        $("#epic").value = "";
        renderFilters();
        refresh();
      }
      $("#clear").onclick = clear;
      $("#new").onclick = () => openEditor();
      $("#clear-selection").onclick = () => {
        selected.clear();
        render();
      };
      $("#expand").onclick = () => {
        collapsed.clear();
        render();
      };
      $("#collapse").onclick = () => {
        all.forEach((r) => collapsed.add(r.id));
        render();
      };
      $("#direction").onclick = () => {
        descending = !descending;
        $("#direction").textContent = descending ? "↓ Desc" : "↑ Asc";
        refresh();
      };
      $("#epic").onchange = $("#sort").onchange = refresh;
      let searchTimer;
      $("#search").oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(refresh, 150);
      };
      document.onclick = (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.view) {
          view = b.dataset.view;
          $("#view-title").textContent = b.textContent;
          document
            .querySelectorAll("[data-view]")
            .forEach((x) => x.setAttribute("aria-current", x === b));
          refresh();
        }
        if (b.dataset.open) detail(b.dataset.open);
        if (b.dataset.toggle) {
          let id = b.dataset.toggle;
          collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
          render();
        }
        if (b.hasAttribute("data-clear")) clear();
        if (b.dataset.close) $("#" + b.dataset.close).close();
      };
      $("#tree").onchange = (e) => {
        if (e.target.dataset.select) {
          let id = e.target.dataset.select;
          if (e.target.checked) {
            // Use the full collection so collapsed and filtered children participate.
            const children = new Map();
            for (const item of all) {
              if (item.archived) continue;
              if (!children.has(item.parent_id)) children.set(item.parent_id, []);
              children.get(item.parent_id).push(item.id);
            }
            const pending = [id], visited = new Set();
            while (pending.length) {
              const next = pending.pop();
              if (visited.has(next)) continue;
              visited.add(next);
              selected.add(next);
              pending.push(...(children.get(next) || []));
            }
          } else {
            selected.delete(id);
          }
          render();
        }
      };
      document.addEventListener(
        "toggle",
        (e) => {
          if (e.target.dataset?.history) {
            let key = e.target.dataset.history;
            e.target.open ? openSummaries.add(key) : openSummaries.delete(key);
          }
        },
        true,
      );
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("#editor").open && !$("#confirm").open)
          closeDetails();
      });
      refresh();
      setInterval(() => {
        if (!$("#editor").open && !$("#confirm").open) refresh();
      }, 5000);
    </script>
  </body>
</html>
