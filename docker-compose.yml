# Local or single-host Taskman. From the repo root, with .env filled in:
#   docker compose up -d --build
# Data is the named volume mounted at /data (tasks in /data/tasks).

services:
  taskman:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskman:local
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      TASKMAN_ACCESS_TOKEN: "${TASKMAN_ACCESS_TOKEN:?Set TASKMAN_ACCESS_TOKEN in .env}"
      TASKMAN_TASKS_DIR: /data/tasks
      TASKMAN_WEB_WORKERS: "${TASKMAN_WEB_WORKERS:-2}"
    volumes:
      - taskman-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8080') + '/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  taskman-data:
