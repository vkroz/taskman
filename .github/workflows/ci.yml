name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskman
          POSTGRES_PASSWORD: taskman
          POSTGRES_DB: taskman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskman -d taskman_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TASKMAN_TEST_DATABASE_URL: postgresql://taskman:taskman@127.0.0.1:5432/taskman_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv==0.13.6
      - name: Install dependencies
        working-directory: taskman
        run: uv sync --frozen --extra dev --extra serve
      - name: Run tests
        working-directory: taskman
        # -rs lists skipped tests. CI is set, so an unreachable database fails.
        run: uv run pytest -rs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build --tag taskman:ci .
