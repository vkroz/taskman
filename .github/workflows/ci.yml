name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request cancels its previous run. A push to staging or main does
  # not: cancelling it could kill a migration halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskman
          POSTGRES_PASSWORD: taskman
          POSTGRES_DB: taskman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskman -d taskman_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TASKMAN_TEST_DATABASE_URL: postgresql://taskman:taskman@127.0.0.1:5432/taskman_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv==0.13.6
      - name: Install dependencies
        working-directory: taskman
        run: uv sync --frozen --extra dev --extra serve
      - name: Run tests
        working-directory: taskman
        # -rs lists skipped tests. CI is set, so an unreachable database fails.
        run: uv run pytest -rs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build --tag taskman:ci .

  # Deploy is in this workflow so it can wait for the test jobs and so the
  # GitHub OIDC token's ref is the push ref. Workload Identity Federation
  # accepts only refs/heads/staging and refs/heads/main. Pull requests skip
  # this job and never request an identity token.
  deploy:
    needs: [test, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/nemos-infra/taskman/taskman:${{ github.sha }}
      PROJECT: nemos-infra
      REGION: us-central1
      SQL_INSTANCE: nemos-infra:us-central1:nemos-pg
      SOCKET: /cloudsql/nemos-infra:us-central1:nemos-pg
      SERVICE: ${{ github.ref == 'refs/heads/main' && 'taskman-prod' || 'taskman-staging' }}
      RUNTIME_SA: ${{ github.ref == 'refs/heads/main' && 'taskman-run-prod@nemos-infra.iam.gserviceaccount.com' || 'taskman-run-staging@nemos-infra.iam.gserviceaccount.com' }}
      DB_NAME: ${{ github.ref == 'refs/heads/main' && 'taskman_prod' || 'taskman_staging' }}
      DB_USER: ${{ github.ref == 'refs/heads/main' && 'taskman_prod' || 'taskman_staging' }}
      DB_SECRET: ${{ github.ref == 'refs/heads/main' && 'taskman-prod-db-password' || 'taskman-staging-db-password' }}
      TOKEN_SECRET: ${{ github.ref == 'refs/heads/main' && 'taskman-prod-api-token' || 'taskman-staging-api-token' }}
      JOB: ${{ github.ref == 'refs/heads/main' && 'taskman-migrate-prod' || 'taskman-migrate-staging' }}
      SERVICE_URL: ${{ github.ref == 'refs/heads/main' && 'https://taskman-prod-1037430670088.us-central1.run.app' || 'https://taskman-staging-1037430670088.us-central1.run.app' }}
      BUILD: ${{ github.ref == 'refs/heads/main' && 'if-missing' || 'always' }}
      SMOKE: ${{ github.ref == 'refs/heads/main' && 'skip' || 'iap' }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse GCP credentials outside a staging or main push
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "Refusing GCP authentication: event is '${GITHUB_EVENT_NAME}', not push." >&2
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/heads/staging)
              [[ "${SERVICE}" == "taskman-staging" && "${SMOKE}" == "iap" && "${BUILD}" == "always" ]] || {
                echo "Staging target did not resolve. Refusing to authenticate." >&2
                exit 1
              }
              ;;
            refs/heads/main)
              [[ "${SERVICE}" == "taskman-prod" && "${SMOKE}" == "skip" && "${BUILD}" == "if-missing" ]] || {
                echo "Production target did not resolve. Refusing to authenticate." >&2
                exit 1
              }
              ;;
            *)
              echo "Refusing GCP authentication: ref '${GITHUB_REF}' is not refs/heads/staging or refs/heads/main." >&2
              exit 1
              ;;
          esac
          echo "Deploy ref ${GITHUB_REF} may authenticate."
          echo "Service ${SERVICE}"
          echo "Image ${IMAGE}"
          echo "Migration job ${JOB}"
          echo "Database ${DB_NAME} as ${DB_USER}"

      # Do not move this step above the guard. Pull requests must not request a token.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: nemos-infra
          workload_identity_provider: projects/1037430670088/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: taskman-deployer@nemos-infra.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: nemos-infra

      - name: Build and push the image
        run: |
          set -euo pipefail
          build_and_push() {
            gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
            docker build --tag "${IMAGE}" .
            docker push "${IMAGE}"
          }
          if [[ "${BUILD}" == "always" ]]; then
            echo "Building ${IMAGE} for this commit."
            build_and_push
          elif [[ "${BUILD}" == "if-missing" ]]; then
            if describe="$(gcloud artifacts docker images describe "${IMAGE}" --project="${PROJECT}" 2>&1)"; then
              echo "Image ${IMAGE} already exists. Deploying it without a rebuild."
            elif grep -Eq 'NOT_FOUND|not found' <<<"${describe}"; then
              echo "Image ${IMAGE} is not in Artifact Registry. Building it."
              build_and_push
            else
              printf '%s\n' "${describe}" >&2
              echo "Registry lookup failed. Not building and not deploying." >&2
              exit 1
            fi
          else
            echo "BUILD must be always or if-missing, got '${BUILD}'." >&2
            exit 1
          fi

      - name: Migrate the database
        run: |
          set -euo pipefail
          # ^|^ is the env-var delimiter so the socket path is one value.
          gcloud run jobs deploy "${JOB}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SA}" \
            --set-cloudsql-instances="${SQL_INSTANCE}" \
            --set-env-vars="^|^TASKMAN_DB_SOCKET=${SOCKET}|TASKMAN_DB_NAME=${DB_NAME}|TASKMAN_DB_USER=${DB_USER}" \
            --set-secrets="TASKMAN_DB_PASSWORD=${DB_SECRET}:latest" \
            --command=/app/venv/bin/taskman \
            --args=migrate \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=300s \
            --quiet
          # --wait returns when the execution finishes. The status check below
          # is what decides success, so a zero exit from gcloud cannot hide a
          # failed migration.
          set +e
          gcloud run jobs execute "${JOB}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --wait \
            --format=json \
            --quiet > /tmp/taskman-migration.json
          exec_status=$?
          set -e
          python3 - <<'PY'
          import json
          import sys

          payload = json.load(open("/tmp/taskman-migration.json", encoding="utf-8"))
          status = payload.get("status") or {}
          succeeded = status.get("succeededCount")
          failed = status.get("failedCount")
          completed = ""
          print(f"succeededCount={succeeded} failedCount={failed}")
          for item in status.get("conditions") or []:
              kind = item.get("type") or item.get("name") or ""
              state = item.get("status") or item.get("state") or ""
              message = item.get("message") or ""
              print(f"{kind}: {state} {message}".rstrip())
              if kind == "Completed":
                  completed = state
          if failed not in (None, 0, "0"):
              sys.exit("Migration job reported failures. Not deploying.")
          if succeeded not in (None, 1, "1"):
              sys.exit("Migration job did not report one success. Not deploying.")
          if str(succeeded) != "1" and completed not in {"True", "CONDITION_SUCCEEDED"}:
              sys.exit("Migration job did not report success. Not deploying.")
          PY
          if [[ "${exec_status}" -ne 0 ]]; then
            echo "gcloud run jobs execute exited ${exec_status}. Not deploying." >&2
            exit 1
          fi

      - name: Deploy the Cloud Run service
        run: |
          set -euo pipefail
          # --no-allow-unauthenticated keeps the service private.
          # --allow-unauthenticated is intentionally not used.
          # --iap keeps Identity-Aware Proxy in front of the service.
          # --add-cloudsql-instances attaches the shared Postgres instance.
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SA}" \
            --add-cloudsql-instances="${SQL_INSTANCE}" \
            --set-env-vars="^|^TASKMAN_DB_SOCKET=${SOCKET}|TASKMAN_DB_NAME=${DB_NAME}|TASKMAN_DB_USER=${DB_USER}" \
            --set-secrets="TASKMAN_DB_PASSWORD=${DB_SECRET}:latest,TASKMAN_ACCESS_TOKEN=${TOKEN_SECRET}:latest" \
            --port=8080 \
            --no-allow-unauthenticated \
            --iap \
            --quiet

      - name: Confirm the revision is Ready
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --format='json(status)' > /tmp/taskman-status.json
          python3 - <<'PY'
          import json
          import sys

          payload = json.load(open("/tmp/taskman-status.json", encoding="utf-8"))
          status = payload.get("status", payload)
          conditions = status.get("conditions") or []
          ready = ""
          for item in conditions:
              kind = item.get("type") or item.get("name") or ""
              message = item.get("message") or ""
              print(f"{kind}: {item.get('status', '')} {message}".rstrip())
              if kind == "Ready":
                  ready = item.get("status") or ""
          if ready != "True":
              sys.exit("Service is not Ready.")
          PY

      - name: Smoke test staging through IAP
        if: env.SMOKE == 'iap'
        env:
          GOOGLE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_TOKEN}" ]]; then
            echo "The auth action did not return an access token." >&2
            exit 1
          fi
          echo "::add-mask::${GOOGLE_TOKEN}"
          app_token="$(gcloud secrets versions access latest --secret="${TOKEN_SECRET}" --project="${PROJECT}")"
          app_token="${app_token//$'\r'/}"
          app_token="${app_token#"${app_token%%[![:space:]]*}"}"
          app_token="${app_token%"${app_token##*[![:space:]]}"}"
          if [[ -z "${app_token}" ]]; then
            echo "Secret ${TOKEN_SECRET} is empty." >&2
            exit 1
          fi
          echo "::add-mask::${app_token}"
          for path in /health /ready; do
            body="$(mktemp)"
            code="$(
              curl --silent --show-error --output "${body}" --write-out '%{http_code}' \
                --max-time 30 \
                --header "Proxy-Authorization: Bearer ${GOOGLE_TOKEN}" \
                --header "Authorization: Bearer ${app_token}" \
                "${SERVICE_URL}${path}"
            )"
            echo "${path} returned ${code}"
            python3 -c 'import json,sys; raw=open(sys.argv[1],encoding="utf-8").read(); print(raw); data=json.loads(raw); sys.exit(0 if sys.argv[2]=="200" and data.get("status")=="ok" else 1)' "${body}" "${code}"
            rm -f "${body}"
          done

      - name: Skip the production HTTP smoke test
        if: env.SMOKE == 'skip'
        run: |
          set -euo pipefail
          cat <<'EOF'
          Skipping the HTTP smoke test for production.
          IAP in front of taskman-prod does not allow the deployer service account
          (taskman-deployer). A request with that account's Google token would be
          rejected even when the app is healthy, so this job does not call
          /health or /ready on production.

          Staging does call both paths through IAP, with Proxy-Authorization set
          to the deployer access token and Authorization set to the app token.

          Production is checked only through the Cloud Run API: the Ready
          condition on taskman-prod must be True after the deploy.
          EOF
